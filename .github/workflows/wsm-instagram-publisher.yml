name: WSM Instagram Publisher

# OIDC self-test marker: 2026-10-03
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/wsm-instagram-publisher.yml"
  schedule:
    # GitHub cron uses UTC. Asia/Jakarta = UTC+7.
    - cron: "45 4 * * *"   # 11:45 WIB — @umrohfriendly feed
    - cron: "30 5 * * *"   # 12:30 WIB — @infoumrohhemat Story
    - cron: "30 12 * * *"  # 19:30 WIB — @infoumrohhemat feed
    - cron: "15 13 * * 0"  # Sunday 20:15 WIB — @muslimhalaltrip feed
    - cron: "45 13 * * *"   # 20:45 WIB — @muslimhalaltrip feed/Story by weekday
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to publish/retry (Asia/Jakarta)"
        required: true
        type: choice
        options:
          - "11:45"
          - "12:30"
          - "19:30"
          - "20:15"
          - "20:45"

permissions:
  contents: read
  id-token: write

concurrency:
  group: wsm-instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out scheduler contract
        uses: actions/checkout@v4

      - name: Resolve exact publisher target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_SLOT: ${{ inputs.slot }}
        run: |
          scripts/resolve-publisher-target.sh

      - name: Mint GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=wsm-campaign-publisher")"

          TOKEN="$(jq -r '.value' <<<"$RESPONSE")"
          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
            echo "GitHub did not return an OIDC token." >&2
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Trigger fail-closed publisher
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PUBLISH_DATE: ${{ steps.target.outputs.date }}
          TIMEZONE: ${{ steps.target.outputs.timezone }}
          ACCOUNT: ${{ steps.target.outputs.account }}
          ACCOUNT_ID: ${{ steps.target.outputs.account_id }}
          SLOT_TIME: ${{ steps.target.outputs.slot_time }}
          MEDIA_TYPE: ${{ steps.target.outputs.media_type }}
          DRY_RUN: ${{ steps.target.outputs.dry_run }}
        run: |
          set -euo pipefail

          BODY="$(jq -nc \
            --arg date "$PUBLISH_DATE" \
            --arg timezone "$TIMEZONE" \
            --arg account "$ACCOUNT" \
            --arg account_id "$ACCOUNT_ID" \
            --arg slot_time "$SLOT_TIME" \
            --arg media_type "$MEDIA_TYPE" \
            --argjson dry_run "$DRY_RUN" \
            '{date:$date,timezone:$timezone,account:$account,account_id:$account_id,slot_time:$slot_time,media_type:$media_type,dry_run:$dry_run}')"

          curl --fail-with-body --silent --show-error \
            --max-time 150 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "https://cubebox-campaign-assets.floot.app/_api/publisher-run"

          echo
