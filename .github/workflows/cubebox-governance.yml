name: CubeBox Governance Gate
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify project governance contract
        run: |
          test -s AGENTS.md
          grep -q "CubeBox-Digital/cubebox-os" AGENTS.md
          grep -q "Decision Continuity Gate" AGENTS.md
      - name: Require evidence receipt in PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          body = os.environ.get("PR_BODY", "")
          fields = ("Governance source", "Project context", "Prior decisions", "Existing implementation", "Conflict assessment", "Relevant gates", "Validation and rollback")
          missing = []
          for field in fields:
              m = re.search(r"(?mi)^\s*-\s*\*\*" + re.escape(field) + r"\*\*:\s*(.*?)\s*$", body)
              value = m.group(1).strip() if m else ""
              if len(value) < 12 or re.fullmatch(r"(?i)(todo|tbd|n/?a|none|pending|unknown|not checked|\[.*\]|-+)", value):
                  missing.append(field)
          if missing:
              print("Missing or placeholder governance evidence: " + ", ".join(missing))
              sys.exit(1)
          print("Receipt fields present. This does NOT validate truth; human review and required-branch-check configuration remain necessary.")
          PY
